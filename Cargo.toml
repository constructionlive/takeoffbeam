[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.16"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/constructionlive/takeoffbeam"
authors = ["construction.live <hello@construction.live>"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
memmap2 = "0.9"
flate2 = "1"
resvg = { version = "0.48", default-features = false, features = ["text"] }
ab_glyph = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
crossbeam-channel = "0.5"
base64 = "0.22"
dirs = "6"
parking_lot = "0.12"
takeoff-agent = { path = "crates/takeoff-agent" }
takeoff-cloud = { path = "crates/takeoff-cloud" }
takeoff-core = { path = "crates/takeoff-core" }
takeoff-pdf = { path = "crates/takeoff-pdf" }
takeoff-models = { path = "crates/takeoff-models" }

# Style lints that fight how this code is written; everything else in
# `cargo clippy -D warnings` (CI) applies.
[workspace.lints.clippy]
collapsible_if = "allow"
field_reassign_with_default = "allow"
new_without_default = "allow"

# Pixel work (fill, trace, burn-in, image decoding) is ~10x slower unoptimized,
# which makes debug runs and the UI tests crawl. Optimize just those crates.
[profile.dev.package.takeoff-pdf]
opt-level = 2
[profile.dev.package.takeoff-core]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
